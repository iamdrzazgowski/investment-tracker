services:
    postgres:
        image: postgres:17
        container_name: investment-tracker-db
        restart: unless-stopped

        environment:
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: admin
            POSTGRES_DB: investment_tracker

        ports:
            - '5432:5432'

        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
